<title>Trip Expenses</title>

<style>
/* Layout concept: a passbook for trips. Each trip is a boarding-pass stub (name left, spend right, perforated).
   Inside a trip: dated expense list, then a report with a donut by category. Phone first, thumb-reach dock for the main action. */
:root{
  --bg:#eef1f5; --card:#fcfcfb; --field:#f4f6f9; --ink:#0f1b2d; --ink2:#4b5565; --mute:#6b7384;
  --line:#dde2ea; --accent:#1b3a6b; --accent-ink:#ffffff; --soft:#e4ebf6; --danger:#b83227; --scrim:rgba(8,12,20,.5);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948; --c9:#6b6a64; --c10:#b5b4aa;
  --f-display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e131b; --card:#171d27; --field:#0f141c; --ink:#eef1f6; --ink2:#b7bfcc; --mute:#8d96a6;
    --line:#2a3240; --accent:#8fb2ec; --accent-ink:#0e131b; --soft:#212b3b; --danger:#ef7a6c; --scrim:rgba(0,0,0,.62);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#a09f96; --c10:#5f5e58;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e131b; --card:#171d27; --field:#0f141c; --ink:#eef1f6; --ink2:#b7bfcc; --mute:#8d96a6;
  --line:#2a3240; --accent:#8fb2ec; --accent-ink:#0e131b; --soft:#212b3b; --danger:#ef7a6c; --scrim:rgba(0,0,0,.62);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767; --c9:#a09f96; --c10:#5f5e58;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding-block:16px calc(150px + env(safe-area-inset-bottom,0px))}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px;line-height:1.1;font-weight:700}
h2{font-size:18px;font-weight:600}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px}
.brand svg{color:var(--accent)}
.link{background:none;border:0;padding:8px 4px;color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;border-radius:8px}
.link svg{flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:10px}
.icon{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:inline-grid;place-items:center;color:var(--ink2)}

/* tabs */
.tabs{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px;margin:16px 0}
.tabs button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:9px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* trip stubs */
.stubs{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.stub{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0;overflow:hidden;position:relative}
.stub-main{padding:16px 16px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:6px}
.stub-name{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.stub-dates{color:var(--ink2);font-size:13.5px}
.stub-amt{padding:16px 18px;border-left:2px dashed var(--line);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:2px;min-width:112px;position:relative}
.stub-amt::before,.stub-amt::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.stub-amt::before{top:-9px}.stub-amt::after{bottom:-9px}
.stub-amt .big{font-size:20px;font-weight:500}
.stub-amt .sm{font-size:12px;color:var(--mute)}
.segbar{display:flex;gap:2px;height:6px;margin-top:4px}
.segbar i{display:block;height:100%;border-radius:3px;min-width:3px}
.segbar.empty{background:var(--line);border-radius:3px}
.chip-status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink2);width:max-content}
.chip-status.now{background:var(--accent);color:var(--accent-ink)}
.summary{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-top:6px}

/* trip header */
.tripbar{display:flex;flex-direction:column;gap:6px}
.tripbar .dates{color:var(--ink2)}
.total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:10px}
.total .big{font-size:34px;font-weight:500}
.total .per{color:var(--ink2);font-size:13.5px}

/* lists */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:thin}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}
.daygroup{margin-top:18px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;padding:0 2px}
.dayhead .d{font-weight:600}
.dayhead .s{font-size:13px;color:var(--ink2)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px}
.row:first-child{border-top:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .m{font-size:13px;color:var(--ink2);overflow-wrap:anywhere}
.row .a{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.row.static{cursor:default}
.empty{border:1.5px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--ink2);margin-top:16px}
.empty h2{color:var(--ink)}
.empty p{margin:0;max-width:34ch}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.loading{color:var(--ink2);padding:40px 0;text-align:center}
.note{font-size:12.5px;color:var(--mute);margin-top:22px}

/* report */
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.panel h2{margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-size:17px;font-weight:500;overflow-wrap:anywhere}
.stat .k{font-size:12.5px;color:var(--ink2)}
.callout{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--soft);display:flex;gap:10px;align-items:center}
.callout b{font-weight:600}
.donutbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:18px;align-items:center}
.donut{width:100%;max-width:250px;margin:0 auto;display:block}
.donut path,.donut circle.seg{cursor:pointer;transition:opacity .15s}
.donut text{font-family:var(--f-mono);fill:var(--ink)}
.donut .lbl{font-family:var(--f-body);fill:var(--ink2)}
.cats{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:5px;align-items:center;width:100%;background:none;border:0;border-radius:10px;padding:8px;text-align:left}
.cat-row[aria-pressed="true"]{background:var(--soft)}
.cat-row .nm{font-weight:600;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.cat-row .nm small{font-weight:400;color:var(--ink2);font-size:12.5px}
.cat-row .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.cat-row .amt small{display:block;color:var(--ink2);font-size:12px}
.track{grid-column:2/4;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.simple-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:6px 0}
.simple-row .nm{font-weight:500;overflow-wrap:anywhere}
.simple-row .amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right}
.simple-row .track{grid-column:1/3}
.chartwrap{overflow-x:auto}
.daily{width:100%;min-width:280px;display:block}
.daily text{font-family:var(--f-mono);fill:var(--mute);font-size:9.5px}
.drill{margin-top:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;z-index:31;left:0;right:0;bottom:74px;max-width:560px;margin:0 auto;max-height:calc(92vh - 74px);max-height:calc(92dvh - 74px);display:flex;flex-direction:column;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
.sheet-body{overflow-y:auto;padding:8px max(18px,env(safe-area-inset-right,0px)) 14px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-foot{padding:12px max(18px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);display:flex;gap:10px}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.danger{flex:none}
.confirm{width:100%;display:flex;flex-direction:column;gap:10px}
.confirm p{margin:0;font-weight:600}
.confirm .two{display:flex;gap:10px}.confirm .two .btn{flex:1}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.fld{grid-column:span 2;display:flex;flex-direction:column;gap:6px;min-width:0;border:0;padding:0;margin:0}
.fld.half{grid-column:span 1}
.fld>label,.fld>legend,.lab{font-size:13px;font-weight:600;color:var(--ink2);padding:0}
.in{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px}
.in:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.money{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--field);padding-left:12px}
.money span{color:var(--ink2);font-family:var(--f-mono)}
.money input{border:0;background:transparent;padding:11px 12px 11px 6px;width:100%;min-width:0;font-size:16px;font-family:var(--f-mono)}
.money:focus-within{outline:2px solid var(--accent)}
.money input:focus{outline:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.seg span{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:var(--field);font-weight:500;font-size:14.5px}
.seg input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.seg.cats span{padding:7px 12px 7px 10px}
.seg.cats input:checked+span{background:var(--soft);border-color:var(--accent);color:var(--ink)}
.err{margin:0;color:var(--danger);font-weight:600;font-size:14px}
.hint{font-size:12.5px;color:var(--mute)}

/* dock + toast */
.dock{position:fixed;left:0;right:0;bottom:74px;z-index:20;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 68%,transparent);pointer-events:none}
.dock .btn{display:flex;width:100%;max-width:720px;margin:0 auto;pointer-events:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast{position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;max-width:calc(100% - 32px);text-align:center}
.budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.budget-card{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:12px;min-width:0}
.budget-card .big{font-family:var(--f-mono);font-size:18px;overflow-wrap:anywhere}
.budget-card .meta{font-size:12px;color:var(--ink2)}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 5px}.progress i{display:block;height:100%;border-radius:99px;background:var(--c3)}
.search-tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.search-tools .in{font-size:15px}.search-tools .wide{grid-column:1/-1}.search-actions{display:flex;gap:8px}.search-actions button{flex:1}
@media(min-width:700px){.budget-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.search-tools{grid-template-columns:repeat(4,minmax(0,1fr))}.search-tools .wide{grid-column:auto}}
@media(max-width:600px){.dock{bottom:92px;padding-top:8px;padding-bottom:8px}.sheet{bottom:92px;max-height:calc(92vh - 92px);max-height:calc(92dvh - 92px)}.toast{bottom:calc(178px + env(safe-area-inset-bottom,0px))}.app{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}}
@media(max-width:420px){.app{padding-top:12px}.stub{grid-template-columns:minmax(0,1fr) auto}.stub-main{padding:13px 10px 13px 12px}.stub-amt{padding:12px 10px;min-width:94px}.stub-amt .big{font-size:17px}.stats{gap:7px}.stat .v{font-size:15px}.panel{padding:13px}.fields{gap:12px 8px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<div class="dock" id="dock" hidden></div>
<div id="sheet"></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';

/* ---------- configuration ---------- */

function dateF(k,l,x){var o={k:k,l:l||'Date',t:'date',half:1};for(var i in (x||{}))o[i]=x[i];return o;}
function place(l,ph){return {k:'place',l:l||'Place',t:'text',ph:ph||'Where was this?'};}
var CATS=[
 {id:'Drink',c:'--c5',f:[{k:'kind',l:'Drink',t:'seg',o:['Tea / Coffee','Juice','Soft drink','Water','Alcohol','Other'],req:1},COST,dateF('date'),place('Place','Cafe, stall or shop'),PAYF]},
 {id:'Entertainment',c:'--c6',f:[{k:'what',l:'Activity',t:'text',ph:'Movie, museum, show',req:1},COST,dateF('date'),place(),PAYF]},
 {id:'Food',c:'--c1',f:[{k:'meal',l:'Meal',t:'seg',o:['Breakfast','Lunch','Dinner','Snacks'],req:1},COST,dateF('date'),place('Place','Restaurant or area'),PAYF]},
 {id:'Hotel',c:'--c3',f:[{k:'name',l:'Hotel',t:'text',ph:'Hotel or stay name',req:1},place('City or area','e.g. Candolim'),dateF('checkIn','Check-in'),dateF('checkOut','Check-out',{after:'checkIn',plus:1}),{k:'cost',l:'Total cost',t:'money',req:1},PAYF]},
 {id:'Medical',c:'--c7',f:[{k:'what',l:'What for',t:'text',ph:'Medicine, doctor, test',req:1},COST,dateF('date'),place('Place','Pharmacy or clinic'),PAYF]},
 {id:'Miscellaneous',c:'--c10',f:[{k:'what',l:'Description',t:'text',ph:'What was it for?',req:1},COST,dateF('date'),PAYF]},
 {id:'Parking',c:'--c8',f:[place('Place','Parking location'),dateF('start','Start date'),dateF('end','End date',{after:'start'}),{k:'cost',l:'Cost',t:'money',req:1},PAYF]},

 {id:'Toll',c:'--c9',f:[place('Toll plaza / route','e.g. Khalapur toll plaza'),COST,dateF('date'),PAYF]},

];

/* ---------- helpers ---------- */
function $(s){return document.querySelector(s);}

var nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});

function pad(n){return n<10?'0'+n:''+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function utc(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}

function titleOf(e){

  switch(e.cat){
    case 'Food':return j([e.meal,e.place])||'Food';
    case 'Drink':return j([e.kind,e.place])||'Drink';
    case 'Hotel':return e.name||'Hotel';
    case 'Shopping':return (e.item||'Item')+(e.qty>1?' ×'+e.qty:'');
    case 'Travel':return j([e.mode,e.place])||'Travel';
    case 'Parking':case 'Toll':return e.place||e.cat;
    default:return e.what||e.cat;
  }
}
function subOf(e,withTrip){
  var p=[e.cat];
  if(e.cat==='Hotel'){if(e.place)p.push(e.place);if(e.checkIn&&e.checkOut)p.push(plural(Math.max(1,dayDiff(e.checkIn,e.checkOut)),'night'));}
  else if(e.cat==='Shopping'||e.cat==='Entertainment'||e.cat==='Medical'){if(e.place)p.push(e.place);}
  if((e.cat==='Travel'||e.cat==='Parking')&&e.start&&e.end&&e.end!==e.start)p.push('to '+dShort(e.end));
  if(e.payBy)p.push(e.payBy);
  if(withTrip&&e._trip)p.push(e._trip);
  return p.join(' · ');
}

    +'<text class="lbl" x="100" y="88" text-anchor="middle" font-size="12">'+lab+'</text>'
    +'<text x="100" y="'+(104+fs/4)+'" text-anchor="middle" font-size="'+fs+'" font-weight="500">'+amt+'</text>'
    +'<text class="lbl" x="100" y="122" text-anchor="middle" font-size="11">'+sub+'</text></svg>';
}
function niceMax(m){var p=Math.pow(10,Math.floor(Math.log10(m))),c=[1,2,2.5,5,10];for(var i=0;i<c.length;i++)if(c[i]*p>=m)return c[i]*p;return 10*p;}
function kfmt(n){return n>=1000?(n/1000).toFixed(n%1000?1:0).replace('.0','')+'k':String(Math.round(n));}
function dailyChart(t){
  var by={};t.expenses.forEach(function(e){var d=dateOf(e);if(d)by[d]=(by[d]||0)+(e.cost||0);});
  var ds=Object.keys(by).sort(),a=t.start,b=t.end;
  if(ds.length){if(ds[0]<a)a=ds[0];if(ds[ds.length-1]>b)b=ds[ds.length-1];}
  var n=dayDiff(a,b)+1;if(n>45){a=addDays(b,-44);n=45;}
  var vals=[],labels=[];for(var i=0;i<n;i++){var d=addDays(a,i);labels.push(d);vals.push(by[d]||0);}
  var max=niceMax(Math.max.apply(null,vals.concat([1])));
  var W=320,H=150,L=34,R=4,T=8,B=22,iw=W-L-R,ih=H-T-B,bw=iw/n,gap=Math.min(3,bw*.25),step=Math.ceil(n/5);
  var g='';[0,.5,1].forEach(function(f){var y=T+ih-f*ih;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(max*f)+'</text>';});
  var bars='',xl='';
  vals.forEach(function(v,i){
    var h=v/max*ih,x=L+i*bw+gap/2,w=Math.max(1,bw-gap);
    if(v>0)bars+='<path d="M'+x.toFixed(2)+' '+(T+ih)+' V'+(T+ih-h+Math.min(3,h)).toFixed(2)+' q0 -'+Math.min(3,h)+' '+Math.min(3,w/2).toFixed(2)+' -'+Math.min(3,h)+' h'+Math.max(0,w-2*Math.min(3,w/2)).toFixed(2)+' q'+Math.min(3,w/2).toFixed(2)+' 0 '+Math.min(3,w/2).toFixed(2)+' '+Math.min(3,h)+' V'+(T+ih)+' Z" fill="var(--c1)"><title>'+dShort(labels[i])+': '+money(v)+'</title></path>';
    if(i%step===0)xl+='<text x="'+(L+i*bw+bw/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+dShort(labels[i])+'</text>';
  });
  return '<svg class="daily" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spend per day">'+g+bars+'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+(T+ih)+'" y2="'+(T+ih)+'" stroke="var(--mute)" stroke-width="1"/>'+xl+'</svg>';
}

/* ---------- render ---------- */
function render(){
  var el=$('#app'),dock=$('#dock');
  if(S.backend==='loading'){el.innerHTML='<p class="loading">Opening your trips…</p>';dock.hidden=true;return;}
  var t=curTrip();if(S.screen==='trip'&&!t){S.screen='home';}
  if(S.screen==='trip'){el.innerHTML=tripScreen(t);dock.innerHTML='<button type="button" class="btn" data-action="add-exp">'+ICON.plus+' Add expense</button>';dock.hidden=false;}
  else{
    el.innerHTML=homeScreen();
    if(S.trips.length&&S.homeTab==='trips'){dock.innerHTML='<button type="button" class="btn" data-action="new-trip">'+ICON.plus+' New trip</button>';dock.hidden=false;}else dock.hidden=true;
  }
}

/* ---------- sheets ---------- */
function closeSheet(){S.sheet=null;$('#sheet').innerHTML='';}
function sheetShell(title,body,foot){
  return '<div class="scrim" data-action="close-sheet"></div><form class="sheet" id="sheetForm" novalidate role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="sheet-head"><h2 id="sheetTitle">'+title+'</h2><button type="button" class="icon" data-action="close-sheet" aria-label="Close">'+ICON.x+'</button></div><div class="sheet-body">'+body+'<p class="err" id="formErr" role="alert" hidden></p></div><div class="sheet-foot">'+foot+'</div></form>';
}
function confirmFoot(label,yes){
  return '<div id="footBtns" style="display:flex;gap:10px;width:100%"><button type="button" class="btn danger" data-action="del-ask">Delete</button><button type="submit" class="btn">Save</button></div><div class="confirm" id="confirmBox" hidden><p>'+label+'</p><div class="two"><button type="button" class="btn ghost" data-action="del-no">Keep it</button><button type="button" class="btn danger" data-action="'+yes+'">Yes, delete</button></div></div>';
}
function openTrip(id){
  var t=id&&S.trips.filter(function(x){return x.id===id;})[0];
  var d=today();
  S.sheet={type:'trip',id:t?t.id:null,v:t?{name:t.name,start:t.start,end:t.end,budgetCash:t.budgetCash||0,budgetUpi:t.budgetUpi||0,budgetCard:t.budgetCard||0}:{name:'',start:d,end:addDays(d,3),budgetCash:0,budgetUpi:0,budgetCard:0}};
  var v=S.sheet.v;
  var body='<div class="fields"><div class="fld"><label for="t_name">Trip name</label><input class="in" id="t_name" type="text" value="'+esc(v.name)+'" placeholder="e.g. Goa weekend" maxlength="80" autocomplete="off"></div>'
   +'<div class="fld half"><label for="t_start">Start date</label><input class="in" id="t_start" type="date" value="'+v.start+'"></div><div class="fld half"><label for="t_end">End date</label><input class="in" id="t_end" type="date" value="'+v.end+'"></div><div class="fld"><label>Budget by payment method (₹)</label></div><div class="fld half"><label for="t_budget_cash">Cash budget</label><input class="in" id="t_budget_cash" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(v.budgetCash)+'"></div><div class="fld half"><label for="t_budget_upi">UPI budget</label><input class="in" id="t_budget_upi" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(v.budgetUpi)+'"></div><div class="fld"><label for="t_budget_card">Credit card budget</label><input class="in" id="t_budget_card" type="number" min="0" step="0.01" inputmode="decimal" value="'+esc(v.budgetCard)+'"></div><div class="fld"><span class="hint">Total budget: <b id="budgetTotalPreview">'+money((Number(v.budgetCash)||0)+(Number(v.budgetUpi)||0)+(Number(v.budgetCard)||0))+'</b> (calculated automatically)</span></div></div>';
  var foot=t?confirmFoot('Delete this trip and its '+plural(t.expenses.length,'expense')+'?','del-trip-yes'):'<button type="submit" class="btn">Create trip</button>';
  $('#sheet').innerHTML=sheetShell(t?'Edit trip':'New trip',body,foot);
  if(!t){var n=$('#t_name');if(n)n.focus();}
}
function defaultDate(t){var d=today();return d<t.start?t.start:d>t.end?t.end:d;}
function openExpense(id){
  var t=curTrip();if(!t)return;
  var e=id&&t.expenses.filter(function(x){return x.id===id;})[0];
  S.sheet={type:'exp',id:e?e.id:null,cat:e?e.cat:'Food',v:e?clone(e):{payBy:S.lastPay||'UPI'},ts:e?e.ts:null};
  var pick='<fieldset class="fld"><legend>Category</legend><div class="seg cats" role="radiogroup">'+CATS.map(function(c){return '<label><input type="radio" name="cat" value="'+c.id+'"'+(c.id===S.sheet.cat?' checked':'')+'><span><i class="dot" style="background:var('+c.c+')"></i>'+c.id+'</span></label>';}).join('')+'</div></fieldset>';
  var body=pick+'<div class="fields" id="fields"></div>';
  var foot=e?confirmFoot('Delete this expense?','del-exp-yes'):'<button type="submit" class="btn">Add expense</button>';
  $('#sheet').innerHTML=sheetShell(e?'Edit expense':'New expense',body,foot);
  renderFields();
}
function firstDate(v){return v.date||v.start||v.checkIn||'';}
function renderFields(){
  var sh=S.sheet,t=curTrip(),spec=CAT[sh.cat].f,v=sh.v,fd=firstDate(v)||defaultDate(t);
  $('#fields').innerHTML=spec.map(function(f){
    var id='f_'+f.k,val=v[f.k],cls='fld'+(f.half?' half':'');
    if(f.t==='seg'||f.t==='pay'){
      var opts=f.t==='pay'?PAY:f.o;
      return '<fieldset class="'+cls+'"><legend>'+f.l+'</legend><div class="seg" role="radiogroup">'+opts.map(function(o){return '<label><input type="radio" name="'+f.k+'" value="'+esc(o)+'"'+(val===o?' checked':'')+'><span>'+esc(o)+'</span></label>';}).join('')+'</div></fieldset>';
    }
    if(f.t==='money')return '<div class="'+cls+'"><label for="'+id+'">'+f.l+'</label><div class="money"><span>₹</span><input id="'+id+'" type="text" inputmode="decimal" autocomplete="off" placeholder="0" value="'+esc(val==null?'':val)+'"></div></div>';
    if(f.t==='num')return '<div class="'+cls+'"><label for="'+id+'">'+f.l+'</label><input class="in" id="'+id+'" type="number" inputmode="numeric" min="1" step="1" value="'+esc(val==null||val===''?1:val)+'"></div>';
    if(f.t==='date'){
      var dv=val;if(!dv){dv=f.after?(v[f.after]||fd):fd;if(f.plus)dv=addDays(v[f.after]||fd,f.plus);}
      return '<div class="'+cls+'"><label for="'+id+'">'+f.l+'</label><input class="in" id="'+id+'" type="date" value="'+esc(dv)+'"></div>';
    }
    return '<div class="'+cls+'"><label for="'+id+'">'+f.l+'</label><input class="in" id="'+id+'" type="text" autocomplete="off" maxlength="120" placeholder="'+esc(f.ph||'')+'" value="'+esc(val||'')+'"></div>';
  }).join('');
}
function collect(){
  var sh=S.sheet,spec=CAT[sh.cat].f,v=Object.assign({},sh.v);
  spec.forEach(function(f){
    if(f.t==='seg'||f.t==='pay'){var r=document.querySelector('input[name="'+f.k+'"]:checked');v[f.k]=r?r.value:'';}
    else{var el=document.getElementById('f_'+f.k);if(el)v[f.k]=el.value;}
  });
  sh.v=v;return v;
}
function showErr(m){var e=$('#formErr');if(!e)return;e.textContent=m;e.hidden=!m;if(m)e.scrollIntoView({block:'nearest'});}
function submitSheet(){
  var sh=S.sheet;if(!sh)return;
  if(sh.type==='trip'){
    var name=$('#t_name').value.trim(),s=$('#t_start').value,e=$('#t_end').value,bCash=Number($('#t_budget_cash').value)||0,bUpi=Number($('#t_budget_upi').value)||0,bCard=Number($('#t_budget_card').value)||0;
    if(!name)return showErr('Give the trip a name.');
    if(!s||!e)return showErr('Pick a start and end date.');
    if(e<s)return showErr('The end date cannot be before the start date.');
    if(bCash<0||bUpi<0||bCard<0)return showErr('Budgets cannot be negative.');
    var t=sh.id&&S.trips.filter(function(x){return x.id===sh.id;})[0];
    var isUpdate=!!t;
    if(t){t.name=name;t.start=s;t.end=e;t.budgetCash=bCash;t.budgetUpi=bUpi;t.budgetCard=bCard;}
    else{t={id:newId('t'),name:name,start:s,end:e,budgetCash:bCash,budgetUpi:bUpi,budgetCard:bCard,createdAt:Date.now(),share_token:makeToken(),expenses:[]};S.trips.push(t);S.tripId=t.id;S.screen='trip';S.tab='expenses';S.filter='All';S.sel=null;}
    persist(t,isUpdate?'Trip updated successfully.':'Trip created successfully.',isUpdate?'Failed to update trip. Please try again.':'Failed to create trip. Please try again.');closeSheet();render();return;
  }
  var v=collect(),spec=CAT[sh.cat].f,out={id:sh.id||newId('e'),cat:sh.cat,ts:sh.ts||Date.now()};
  for(var i=0;i<spec.length;i++){
    var f=spec[i],val=v[f.k];
    if(f.t==='money'){val=parseFloat(String(val==null?'':val).replace(/[,\s]/g,''));if(!(val>0))return showErr('Enter the cost as a number above zero.');val=Math.round(val*100)/100;}
    else if(f.t==='num'){val=parseInt(val,10);if(!(val>=1))return showErr('Quantity must be at least 1.');}
    else if(f.t==='date'){if(!val)return showErr('Pick a date for "'+f.l+'".');}
    else{val=String(val||'').trim();if(f.req&&!val)return showErr((f.t==='seg'||f.t==='pay'?'Choose ':'Fill in ')+'"'+f.l+'".');}
    if(f.t!=='date'||val)out[f.k]=val;
    if(f.after&&v[f.after]&&val<v[f.after])return showErr('"'+f.l+'" cannot be before "'+spec.filter(function(x){return x.k===f.after;})[0].l+'".');
  }
  S.lastPay=out.payBy;
  var tr=curTrip();
  var idx=tr.expenses.map(function(x){return x.id;}).indexOf(out.id),isUpdate=idx>=0;
  if(isUpdate)tr.expenses[idx]=out;else tr.expenses.push(out);
  S.sel=null;persist(tr,isUpdate?'Expense updated successfully.':'Expense added successfully.',isUpdate?'Failed to update expense. Please try again.':'Failed to add expense. Please try again.');closeSheet();render();
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-action]');if(!el)return;
  var a=el.getAttribute('data-action'),id=el.getAttribute('data-id'),cat=el.getAttribute('data-cat');
  switch(a){
    case 'new-trip':openTrip();break;
    case 'load-sample':loadSample();break;
    case 'open-trip':S.tripId=id;S.screen='trip';S.tab='expenses';S.filter='All';S.sel=null;render();window.scrollTo(0,0);break;
    case 'back':S.screen='home';S.sel=null;render();window.scrollTo(0,0);break;
    case 'edit-trip':openTrip(S.tripId);break;
    case 'share-trip':var st=curTrip();if(st){var u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('trip',st.share_token||'');if(navigator.share){navigator.share({title:st.name+' · Trip Expenses',url:u.toString()}).catch(function(){});}else if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u.toString()).then(function(){toast('Trip link copied.');},function(){prompt('Copy this trip link:',u.toString());});}else prompt('Copy this trip link:',u.toString());}break;
    case 'tab':S.tab=el.getAttribute('data-tab');S.sel=null;render();break;
    case 'home-tab':S.homeTab=el.getAttribute('data-tab');S.sel=null;render();break;
    case 'add-exp':openExpense();break;
    case 'edit-exp':openExpense(id);break;
    case 'filter':S.filter=cat;render();break;
    case 'apply-search':S.search=$('#expenseSearch').value.trim();S.payFilter=$('#expensePay').value;S.dateFrom=$('#expenseFrom').value;S.dateTo=$('#expenseTo').value;render();break;
    case 'clear-search':S.search='';S.payFilter='All';S.dateFrom='';S.dateTo='';S.filter='All';render();break;
    case 'sel-cat':S.sel=S.sel===cat?null:cat;render();break;
    case 'close-sheet':closeSheet();break;
    case 'del-ask':$('#footBtns').hidden=true;$('#footBtns').style.display='none';$('#confirmBox').hidden=false;break;
    case 'del-no':$('#confirmBox').hidden=true;$('#footBtns').hidden=false;$('#footBtns').style.display='flex';break;
    case 'del-exp-yes':var t=curTrip();t.expenses=t.expenses.filter(function(x){return x.id!==S.sheet.id;});persist(t,'Expense deleted successfully.','Failed to delete expense. Please try again.');closeSheet();render();break;
    case 'del-trip-yes':var tid=S.sheet.id;dropTrip(tid);closeSheet();S.screen='home';S.tripId=null;render();window.scrollTo(0,0);break;
  }
});
document.addEventListener('input',function(ev){if(ev.target&&['t_budget_cash','t_budget_upi','t_budget_card'].indexOf(ev.target.id)>=0){var a=Number($('#t_budget_cash').value)||0,b=Number($('#t_budget_upi').value)||0,c=Number($('#t_budget_card').value)||0,el=$('#budgetTotalPreview');if(el)el.textContent=money(a+b+c);}});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.name==='cat'&&S.sheet&&S.sheet.type==='exp'){
    collect();S.sheet.cat=ev.target.value;showErr('');renderFields();
  }
});
document.addEventListener('submit',function(ev){ev.preventDefault();submitSheet();});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.sheet)closeSheet();});

function loadSample(){
  var d=today(),s=addDays(d,-6),e=addDays(d,-3),k=0;
  function x(o){o.id=newId('e');o.ts=Date.now()+(k++);return o;}
  var t={id:newId('t'),name:'Goa weekend (example)',start:s,end:e,createdAt:Date.now(),share_token:makeToken(),expenses:[
    x({cat:'Travel',mode:'Train',place:'Pune to Madgaon',start:s,end:s,cost:1850,payBy:'UPI'}),
    x({cat:'Hotel',name:'Beachside Stay',place:'Candolim',checkIn:s,checkOut:e,cost:14400,payBy:'Credit card'}),
    x({cat:'Food',meal:'Lunch',place:'Fisherman’s Wharf',date:s,cost:1260,payBy:'UPI'}),
    x({cat:'Drink',kind:'Tea / Coffee',place:'Station stall',date:s,cost:60,payBy:'Cash'}),
    x({cat:'Travel',mode:'Taxi',place:'Station to hotel',start:s,end:s,cost:850,payBy:'Cash'}),
    x({cat:'Food',meal:'Dinner',place:'Beach shack',date:addDays(s,1),cost:1780,payBy:'UPI'}),
    x({cat:'Entertainment',what:'Water sports',place:'Calangute',date:addDays(s,1),cost:2400,payBy:'Cash'}),
    x({cat:'Travel',mode:'Rental',place:'Scooter, 2 days',start:addDays(s,1),end:addDays(s,2),cost:1400,payBy:'Cash'}),
    x({cat:'Parking',place:'Baga beach',start:addDays(s,2),end:addDays(s,2),cost:100,payBy:'Cash'}),
    x({cat:'Shopping',item:'Cashew packs',qty:4,place:'Mapusa market',date:addDays(s,2),cost:1600,payBy:'UPI'}),
    x({cat:'Medical',what:'Sunburn cream',place:'Pharmacy',date:addDays(s,2),cost:340,payBy:'UPI'}),
    x({cat:'Toll',place:'Khalapur toll plaza',date:e,cost:210,payBy:'UPI'}),
    x({cat:'Food',meal:'Breakfast',place:'Hotel cafe',date:e,cost:620,payBy:'Cash'}),
    x({cat:'Miscellaneous',what:'Tips',date:e,cost:300,payBy:'Cash'})
  ]};
  S.trips.push(t);persist(t);S.tripId=t.id;S.screen='trip';S.tab='report';S.sel=null;render();
}

/* ---------- boot ---------- */
render();
(function boot(){
  if(!window.supabase||!window.supabase.createClient){S.backend='local';S.trips=[];render();toast('Supabase library did not load. Check your internet connection.');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  S.backend='db';
  loadTrips().catch(function(e){console.error(e);S.backend='db';S.trips=[];render();toast(e&&e.message&&e.message.indexOf('invalid')>=0?e.message:'Could not load Supabase data. Check table names and Row Level Security policies.');});
  // Refresh shared changes from other devices while the user is not editing a form.
  setInterval(function(){if(S.backend==='db'&&!S.sheet)loadTrips().catch(function(e){console.warn(e);});},12000);
})();
})();
</script>
